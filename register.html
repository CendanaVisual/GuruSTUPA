<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - GuruSTUPA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col md:flex-row">

    <!-- Sisi Kiri: Form Pendaftaran -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-20">
        <div class="w-full max-w-md space-y-8">
            <div>
                <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-indigo-600 font-medium transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali ke Beranda
                </a>
            </div>
            <div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Daftar Akun Baru</h2>
                <p class="mt-2 text-sm text-slate-500">Buat akun untuk merekam modul ajar dan mengakses SQL Editor.</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700">Nama Lengkap</label>
                    <input type="text" id="name" required placeholder="Contoh: Budi Santoso, S.Pd." class="mt-1 block w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700">Alamat Email</label>
                    <input type="email" id="email" required placeholder="nama@sekolah.sch.id" class="mt-1 block w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700">Kata Sandi</label>
                    <input type="password" id="password" required placeholder="Minimal 8 karakter" class="mt-1 block w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
                </div>

                <div id="errorMessage" class="text-xs text-red-500 hidden font-semibold"></div>
                <div id="successMessage" class="text-xs text-emerald-600 hidden font-semibold"></div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition text-sm">
                    Daftar Sekarang
                </button>
            </form>

            <p class="text-center text-sm text-slate-500">
                Sudah memiliki akun? 
                <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-700 transition">Masuk di sini</a>
            </p>
        </div>
    </div>

    <!-- Sisi Kanan: Visual Banner -->
    <div class="hidden md:flex md:w-1/2 bg-slate-900 relative items-center justify-center p-12 text-white overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-tr from-indigo-950 via-slate-900 to-indigo-900 opacity-90"></div>
        <div class="relative max-w-lg space-y-6 z-10">
            <span class="text-xs uppercase tracking-widest font-bold text-indigo-400">Database Neon Terkoneksi</span>
            <h3 class="text-3xl font-extrabold leading-tight">Mulai rancang pembelajaran interaktif Anda hari ini.</h3>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitBtn.innerText = "Mendaftarkan...";

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    successDiv.innerText = "Pendaftaran Berhasil! Mengalihkan ke login...";
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorDiv.innerText = data.error || 'Pendaftaran gagal';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Koneksi ke backend gagal. Pastikan server lokal berjalan.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.innerText = "Daftar Sekarang";
            }
        });
    </script>
</body>
</html>
